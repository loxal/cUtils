[package]
name = "bitwarden-dedup"
version = "0.1.0"
edition = "2024"
description = "Deduplicate a Bitwarden JSON vault export into an import-ready file while preserving TOTP secrets, FIDO2 credentials, and URI lists"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
serde_json = "1.0.149"
